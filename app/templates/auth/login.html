{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark">N</div>
    <p class="eyebrow mb-2">NORTHSTAR SOLUTIONS</p>
    <h1 class="h3 mb-2">IT Asset Tracker</h1>
    <p class="text-secondary mb-4">Sign in to manage your equipment and service activity.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="mb-3"><label class="form-label" for="email">Work email</label><input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="username" required autofocus></div>
      <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
